name: Build JARVIS v48 from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "JARVIS_v48_SOURCE.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: |
          rm -rf JARVIS_v48
          mkdir JARVIS_v48
          unzip -q JARVIS_v48_SOURCE.zip -d JARVIS_v48

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build debug
        working-directory: JARVIS_v48/android
        run: gradle --no-daemon assembleDebug

      - name: Build release
        working-directory: JARVIS_v48/android
        run: |
          gradle --no-daemon assembleRelease

          keytool -genkeypair -v \
            -keystore jarvis-ci-release.keystore \
            -storepass jarvis-ci \
            -keypass jarvis-ci \
            -alias jarvis-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=JARVIS CI, OU=JARVIS, O=JARVIS, C=US"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks jarvis-ci-release.keystore \
            --ks-pass pass:jarvis-ci \
            --key-pass pass:jarvis-ci \
            --ks-key-alias jarvis-ci \
            --out build/outputs/apk/release/JARVIS-v48-release.apk \
            build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v48-APKs
          path: |
            JARVIS_v48/android/app/build/outputs/apk/debug/app-debug.apk
            JARVIS_v48/android/app/build/outputs/apk/release/JARVIS-v48-release.apk
